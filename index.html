<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>C++ Executor</title>

<style>

/* =========================================================
   BASE
========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    background: #0d0d0d;
    color: white;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body {

    padding-bottom: 40px;

}


/* =========================================================
   CABEÇALHO
========================================================= */

.header {

    height: 60px;

    display: flex;

    align-items: center;

    justify-content: center;

    background: #111;

    border-bottom: 1px solid #292929;

    font-size: 21px;

    font-weight: 700;

}


/* =========================================================
   ÁREA DO EDITOR
========================================================= */

.editor-area {

    padding: 15px;

}

.label {

    margin-bottom: 8px;

    color: #888;

    font-size: 13px;

    font-weight: 700;

}


/* =========================================================
   EDITOR
========================================================= */

.editor-wrapper {

    display: flex;

    width: 100%;

    height: 48vh;

    min-height: 300px;

    overflow: hidden;

    background: #181818;

    border: 1px solid #333;

    border-radius: 10px;

}


/* =========================================================
   NÚMEROS DAS LINHAS
========================================================= */

.line-numbers {

    width: 44px;

    flex-shrink: 0;

    padding-top: 15px;

    padding-right: 9px;

    background: #151515;

    color: #666;

    text-align: right;

    font-family:
        Menlo,
        Monaco,
        Consolas,
        monospace;

    font-size: 15px;

    line-height: 1.5;

    user-select: none;

    overflow: hidden;

}


/* =========================================================
   TEXTAREA
========================================================= */

.editor {

    flex: 1;

    width: 100%;

    height: 100%;

    padding: 15px;

    margin: 0;

    resize: none;

    outline: none;

    border: none;

    background: #181818;

    color: #f5f5f5;

    caret-color: white;

    font-family:
        Menlo,
        Monaco,
        Consolas,
        monospace;

    font-size: 15px;

    line-height: 1.5;

    tab-size: 4;

    white-space: pre;

    overflow: auto;

    -webkit-overflow-scrolling: touch;

}

.editor::selection {

    background: #444;

}


/* =========================================================
   BOTÕES PRINCIPAIS
========================================================= */

.buttons {

    display: flex;

    gap: 8px;

    padding:
        0
        15px
        15px;

}

button {

    flex: 1;

    min-height: 46px;

    padding: 12px 8px;

    border: none;

    border-radius: 10px;

    color: white;

    font-size: 14px;

    font-weight: 700;

    cursor: pointer;

}

button:active {

    transform: scale(0.97);

}

.run {

    background: #20c968;

}

.save {

    background: #2878ff;

}

.clear {

    background: #292929;

}


/* =========================================================
   TERMINAL
========================================================= */

.terminal-area {

    padding:
        0
        15px
        20px;

}

.terminal {

    min-height: 150px;

    padding: 15px;

    background: #050505;

    border: 1px solid #222;

    border-radius: 10px;

    color: #00ff66;

    font-family:
        Menlo,
        Monaco,
        Consolas,
        monospace;

    font-size: 14px;

    line-height: 1.5;

    white-space: pre-wrap;

    overflow-x: auto;

}


/* =========================================================
   ENTRADA STDIN
========================================================= */

.input-area {

    display: none;

    margin-top: 10px;

}

.stdin-input {

    width: 100%;

    min-height: 48px;

    padding: 13px;

    background: #111;

    color: white;

    border: 1px solid #333;

    border-radius: 10px;

    outline: none;

    font-family:
        Menlo,
        Monaco,
        Consolas,
        monospace;

    font-size: 15px;

}

.stdin-input:focus {

    border-color: #2878ff;

}

.send-input {

    width: 100%;

    margin-top: 8px;

    background: #2878ff;

}


/* =========================================================
   STATUS
========================================================= */

.status {

    margin-top: 8px;

    color: #777;

    font-size: 12px;

}


/* =========================================================
   CÓDIGOS SALVOS
========================================================= */

.saved-area {

    padding:
        0
        15px
        20px;

}

.saved-title {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 10px;

    color: #888;

    font-size: 13px;

    font-weight: 700;

}

.saved-list {

    display: flex;

    flex-direction: column;

    gap: 8px;

}

.saved-item {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 10px;

    padding: 12px;

    background: #181818;

    border: 1px solid #2b2b2b;

    border-radius: 10px;

}

.saved-name {

    flex: 1;

    min-width: 0;

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;

    color: white;

    font-size: 14px;

}

.saved-actions {

    display: flex;

    gap: 6px;

}

.saved-actions button {

    flex: none;

    min-height: auto;

    width: auto;

    padding:
        8px
        10px;

    font-size: 12px;

}

.open-btn {

    background: #333;

}

.delete-btn {

    background: #8f2525;

}


/* =========================================================
   MODAL
========================================================= */

.modal {

    display: none;

    position: fixed;

    inset: 0;

    background: rgba(0,0,0,0.75);

    align-items: center;

    justify-content: center;

    padding: 20px;

    z-index: 1000;

}

.modal-box {

    width: 100%;

    max-width: 400px;

    padding: 20px;

    background: #181818;

    border: 1px solid #333;

    border-radius: 14px;

}

.modal-box h2 {

    margin-top: 0;

    font-size: 19px;

}

.modal-box input {

    width: 100%;

    padding: 13px;

    margin:
        10px
        0
        15px;

    border: 1px solid #444;

    border-radius: 8px;

    outline: none;

    background: #0d0d0d;

    color: white;

    font-size: 16px;

}

.modal-buttons {

    display: flex;

    gap: 8px;

}

.modal-buttons button {

    padding: 13px;

}

.cancel {

    background: #333;

}

.confirm {

    background: #2878ff;

}


/* =========================================================
   AVISO
========================================================= */

.notice {

    margin-top: 10px;

    padding: 10px;

    background: #151515;

    border-radius: 8px;

    color: #777;

    font-size: 12px;

}

</style>

</head>


<body>


<!-- =====================================================
     CABEÇALHO
===================================================== -->

<div class="header">

    C++ EXECUTOR

</div>


<!-- =====================================================
     EDITOR
===================================================== -->

<div class="editor-area">

    <div class="label">

        CÓDIGO C++

    </div>


    <div class="editor-wrapper">


        <div
            class="line-numbers"
            id="lineNumbers">
        </div>


        <textarea
            class="editor"
            id="code"
            spellcheck="false"
            autocapitalize="off"
            autocomplete="off"
            autocorrect="off">#include <iostream>

int main() {

    std::cout << "Olá, mundo!";

    return 0;

}</textarea>


    </div>

</div>


<!-- =====================================================
     BOTÕES
===================================================== -->

<div class="buttons">


    <button
        class="run"
        id="runButton"
        onclick="executar()">

        ▶ EXECUTAR

    </button>


    <button
        class="save"
        onclick="abrirSalvar()">

        💾 SALVAR

    </button>


    <button
        class="clear"
        onclick="limpar()">

        LIMPAR

    </button>


</div>


<!-- =====================================================
     TERMINAL
===================================================== -->

<div class="terminal-area">

    <div class="label">

        TERMINAL

    </div>


    <div
        class="terminal"
        id="terminal">

        > Aguardando execução...

    </div>


    <!-- =================================================
         ENTRADA
    ================================================== -->

    <div
        class="input-area"
        id="inputArea">


        <input
            class="stdin-input"
            id="stdinInput"
            type="text"
            placeholder="Digite a entrada do programa..."
            autocomplete="off">


        <button
            class="send-input"
            onclick="enviarEntrada()">

            ENVIAR ENTRADA

        </button>


    </div>


    <div
        class="status"
        id="status">

    </div>


    <div class="notice">

        Dica: programas que utilizam
        <b>cin</b> podem receber entrada pelo campo acima.

    </div>

</div>


<!-- =====================================================
     CÓDIGOS SALVOS
===================================================== -->

<div class="saved-area">


    <div class="saved-title">

        <span>

            MEUS CÓDIGOS

        </span>


        <span id="savedCount">

            0

        </span>

    </div>


    <div
        class="saved-list"
        id="savedList">

    </div>

</div>


<!-- =====================================================
     MODAL DE SALVAMENTO
===================================================== -->

<div
    class="modal"
    id="saveModal">


    <div class="modal-box">


        <h2>

            Salvar código

        </h2>


        <input
            id="codeName"
            type="text"
            placeholder="Nome do código"
            autocomplete="off">


        <div class="modal-buttons">


            <button
                class="cancel"
                onclick="fecharSalvar()">

                CANCELAR

            </button>


            <button
                class="confirm"
                onclick="salvarCodigo()">

                SALVAR

            </button>


        </div>


    </div>

</div>


<script>


/* =========================================================
   ELEMENTOS
========================================================= */

const editor =
    document.getElementById("code");

const lineNumbers =
    document.getElementById("lineNumbers");

const terminal =
    document.getElementById("terminal");

const inputArea =
    document.getElementById("inputArea");

const stdinInput =
    document.getElementById("stdinInput");

const status =
    document.getElementById("status");

const savedList =
    document.getElementById("savedList");

const savedCount =
    document.getElementById("savedCount");

const runButton =
    document.getElementById("runButton");


/* =========================================================
   ESTADO
========================================================= */

let executando =
    false;

let stdinAtual =
    "";

let aguardandoEntrada =
    false;


/* =========================================================
   NUMERAÇÃO
========================================================= */

function atualizarLinhas() {


    const quantidade =
        editor.value.split("\n").length;


    let numeros = "";


    for (
        let i = 1;
        i <= quantidade;
        i++
    ) {

        numeros +=
            i + "<br>";

    }


    lineNumbers.innerHTML =
        numeros;

}


/* =========================================================
   DIGITAÇÃO
========================================================= */

editor.addEventListener(
    "input",
    function() {

        atualizarLinhas();

    }
);


/* =========================================================
   SCROLL
========================================================= */

editor.addEventListener(
    "scroll",
    function() {

        lineNumbers.scrollTop =
            editor.scrollTop;

    }
);


/* =========================================================
   TAB
========================================================= */

editor.addEventListener(
    "keydown",
    function(event) {


        if (
            event.key === "Tab"
        ) {

            event.preventDefault();


            const inicio =
                editor.selectionStart;

            const fim =
                editor.selectionEnd;


            editor.value =

                editor.value.substring(
                    0,
                    inicio
                )

                +

                "    "

                +

                editor.value.substring(
                    fim
                );


            editor.selectionStart =
                inicio + 4;

            editor.selectionEnd =
                inicio + 4;


            atualizarLinhas();

        }

    }
);


/* =========================================================
   MOSTRAR ENTRADA
========================================================= */

function mostrarEntrada() {


    inputArea.style.display =
        "block";


    aguardandoEntrada =
        true;


    stdinInput.value =
        "";


    setTimeout(
        function() {

            stdinInput.focus();

        },
        100
    );

}


/* =========================================================
   ESCONDER ENTRADA
========================================================= */

function esconderEntrada() {


    inputArea.style.display =
        "none";


    aguardandoEntrada =
        false;

}


/* =========================================================
   ENVIAR ENTRADA
========================================================= */

function enviarEntrada() {


    stdinAtual =
        stdinInput.value;


    esconderEntrada();


    executar();

}


/* =========================================================
   EXECUTAR
========================================================= */

async function executar() {


    if (executando) {

        terminal.textContent =
            "> Já existe uma execução em andamento.";

        return;

    }


    const codigo =
        editor.value;


    if (!codigo.trim()) {

        terminal.textContent =
            "> Nenhum código foi inserido.";

        return;

    }


    executando =
        true;


    runButton.disabled =
        true;


    runButton.textContent =
        "⏳ EXECUTANDO";


    status.textContent =
        "";


    terminal.textContent =
        "> Enviando código para Judge0...\n";


    try {


        /* ============================================
           BASE64 DO CÓDIGO
        ============================================ */

        const codigoBase64 =

            btoa(

                unescape(

                    encodeURIComponent(
                        codigo
                    )

                )

            );


        /* ============================================
           BASE64 DO STDIN
        ============================================ */

        let stdinBase64 = "";


        if (stdinAtual) {

            stdinBase64 =

                btoa(

                    unescape(

                        encodeURIComponent(
                            stdinAtual
                        )

                    )

                );

        }


        /* ============================================
           ENVIO
        ============================================ */

        const resposta =

            await fetch(

                "https://ce.judge0.com/submissions?base64_encoded=true&wait=true",

                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:

                        JSON.stringify({

                            language_id:
                                54,

                            source_code:
                                codigoBase64,

                            stdin:
                                stdinBase64

                        })

                }

            );


        /* ============================================
           HTTP
        ============================================ */

        if (!resposta.ok) {

            throw new Error(
                "Erro HTTP " +
                resposta.status
            );

        }


        /* ============================================
           RESULTADO
        ============================================ */

        const resultado =
            await resposta.json();


        let saida =
            "";


        /* ============================================
           STDOUT
        ============================================ */

        if (resultado.stdout) {

            saida +=

                decodificarBase64(
                    resultado.stdout
                );

        }


        /* ============================================
           STDERR
        ============================================ */

        if (resultado.stderr) {


            if (saida) {

                saida +=
                    "\n";

            }


            saida +=

                decodificarBase64(
                    resultado.stderr
                );

        }


        /* ============================================
           ERRO DE COMPILAÇÃO
        ============================================ */

        if (
            resultado.compile_output
        ) {


            if (saida) {

                saida +=
                    "\n";

            }


            saida +=

                decodificarBase64(
                    resultado.compile_output
                );

        }


        /* ============================================
           STATUS
        ============================================ */

        let descricao =
            "";


        if (
            resultado.status &&
            resultado.status.description
        ) {

            descricao =
                resultado.status.description;

        }


        /* ============================================
           TEMPO
        ============================================ */

        if (resultado.time) {

            status.textContent =

                "Tempo: " +
                resultado.time +
                "s";

        }


        /* ============================================
           MEMÓRIA
        ============================================ */

        if (resultado.memory) {

            if (status.textContent) {

                status.textContent +=
                    "  •  ";

            }

            status.textContent +=

                "Memória: " +
                resultado.memory +
                " KB";

        }


        /* ============================================
           SEM SAÍDA
        ============================================ */

        if (!saida.trim()) {


            if (descricao) {

                saida =
                    "> " +
                    descricao;

            }

            else {

                saida =
                    "> Programa executado sem saída.";

            }

        }


        /* ============================================
           TERMINAL
        ============================================ */

        terminal.textContent =
            saida;


        /* ============================================
           STATUS VISUAL
        ============================================ */

        if (
            resultado.status &&
            resultado.status.id === 3
        ) {

            status.textContent +=
                "  •  ✓ Execução concluída";

        }

        else if (
            resultado.status &&
            resultado.status.id === 6
        ) {

            status.textContent +=
                "  •  ❌ Erro de compilação";

        }

        else if (
            resultado.status &&
            resultado.status.id === 5
        ) {

            status.textContent +=
                "  •  ⏱️ Tempo limite excedido";

        }


        /* ============================================
           LIMPA STDIN
        ============================================ */

        stdinAtual =
            "";


    }

    catch (erro) {


        terminal.textContent =

            "> ERRO:\n\n" +
            erro.message;


        status.textContent =
            "Falha na comunicação com o Judge0.";

    }


    finally {


        executando =
            false;


        runButton.disabled =
            false;


        runButton.textContent =
            "▶ EXECUTAR";

    }

}


/* =========================================================
   BASE64 → TEXTO
========================================================= */

function decodificarBase64(texto) {


    try {

        return decodeURIComponent(
            escape(
                atob(texto)
            )
        );

    }

    catch (erro) {

        return atob(texto);

    }

}


/* =========================================================
   LIMPAR
========================================================= */

function limpar() {


    editor.value =
        "";


    atualizarLinhas();


    terminal.textContent =
        "> Terminal limpo.";


    status.textContent =
        "";


    stdinAtual =
        "";


    esconderEntrada();

}


/* =========================================================
   SALVAR
========================================================= */

function abrirSalvar() {


    document.getElementById(
        "saveModal"
    ).style.display =
        "flex";


    document.getElementById(
        "codeName"
    ).value =
        "";


    setTimeout(
        function() {

            document.getElementById(
                "codeName"
            ).focus();

        },
        100
    );

}


function fecharSalvar() {


    document.getElementById(
        "saveModal"
    ).style.display =
        "none";

}


function salvarCodigo() {


    const input =
        document.getElementById(
            "codeName"
        );


    let nome =
        input.value.trim();


    if (!nome) {

        nome =
            "Código sem nome";

    }


    const codigo =
        editor.value;


    let codigos =

        JSON.parse(

            localStorage.getItem(
                "cpp_codigos"
            ) || "[]"

        );


    codigos.push({

        id:
            Date.now(),

        nome:
            nome,

        codigo:
            codigo,

        data:
            new Date().toLocaleString(
                "pt-BR"
            )

    });


    localStorage.setItem(

        "cpp_codigos",

        JSON.stringify(
            codigos
        )

    );


    fecharSalvar();


    carregarCodigos();


    terminal.textContent =

        "> Código '" +
        nome +
        "' salvo.";

}


/* =========================================================
   CARREGAR CÓDIGOS
========================================================= */

function carregarCodigos() {


    const codigos =

        JSON.parse(

            localStorage.getItem(
                "cpp_codigos"
            ) || "[]"

        );


    savedList.innerHTML =
        "";


    savedCount.textContent =
        codigos.length;


    if (
        codigos.length === 0
    ) {


        savedList.innerHTML =

            '<div style="color:#666;font-size:13px;">' +

            'Nenhum código salvo.' +

            '</div>';


        return;

    }


    codigos.forEach(
        function(item) {


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "saved-item";


            const nome =
                document.createElement(
                    "div"
                );


            nome.className =
                "saved-name";


            nome.textContent =
                item.nome;


            const actions =
                document.createElement(
                    "div"
                );


            actions.className =
                "saved-actions";


            const abrir =
                document.createElement(
                    "button"
                );


            abrir.className =
                "open-btn";


            abrir.textContent =
                "ABRIR";


            abrir.onclick =
                function() {

                    abrirCodigo(
                        item.id
                    );

                };


            const excluir =
                document.createElement(
                    "button"
                );


            excluir.className =
                "delete-btn";


            excluir.textContent =
                "X";


            excluir.onclick =
                function() {

                    excluirCodigo(
                        item.id
                    );

                };


            actions.appendChild(
                abrir
            );


            actions.appendChild(
                excluir
            );


            div.appendChild(
                nome
            );


            div.appendChild(
                actions
            );


            savedList.appendChild(
                div
            );

        }
    );

}


/* =========================================================
   ABRIR CÓDIGO
========================================================= */

function abrirCodigo(id) {


    const codigos =

        JSON.parse(

            localStorage.getItem(
                "cpp_codigos"
            ) || "[]"

        );


    const codigo =
        codigos.find(
            function(item) {

                return item.id === id;

            }
        );


    if (!codigo) {

        return;

    }


    editor.value =
        codigo.codigo;


    atualizarLinhas();


    terminal.textContent =

        "> Código '" +
        codigo.nome +
        "' carregado.";


    status.textContent =
        "";


    window.scrollTo(
        0,
        0
    );

}


/* =========================================================
   EXCLUIR
========================================================= */

function excluirCodigo(id) {


    if (
        !confirm(
            "Excluir este código?"
        )
    ) {

        return;

    }


    let codigos =

        JSON.parse(

            localStorage.getItem(
                "cpp_codigos"
            ) || "[]"

        );


    codigos =

        codigos.filter(
            function(item) {

                return item.id !== id;

            }
        );


    localStorage.setItem(

        "cpp_codigos",

        JSON.stringify(
            codigos
        )

    );


    carregarCodigos();

}


/* =========================================================
   ENTER NO CAMPO STDIN
========================================================= */

stdinInput.addEventListener(

    "keydown",

    function(event) {


        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            enviarEntrada();

        }

    }

);


/* =========================================================
   ENTER NO NOME DO ARQUIVO
========================================================= */

document
    .getElementById("codeName")
    .addEventListener(

        "keydown",

        function(event) {


            if (
                event.key === "Enter"
            ) {

                event.preventDefault();

                salvarCodigo();

            }

        }

    );


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

atualizarLinhas();

carregarCodigos();

esconderEntrada();


</script>

</body>

</html>
