<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Snake Forge</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#0b0d10;
  color:#f1f3f5;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  overflow:hidden;
}

button{
  font:inherit;
  border:0;
  color:inherit;
}

.app{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
}

/* HEADER */

.header{
  height:64px;
  min-height:64px;
  padding:0 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #20242a;
  background:#0d1014;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
  font-size:17px;
  font-weight:700;
  letter-spacing:.3px;
}

.logo{
  width:30px;
  height:30px;
  border-radius:8px;
  background:#171b20;
  display:flex;
  align-items:center;
  justify-content:center;
}

.logo svg{
  width:19px;
  height:19px;
  stroke:#8ee35d;
  fill:none;
  stroke-width:2;
}

.menu{
  width:38px;
  height:38px;
  border-radius:9px;
  background:transparent;
  display:flex;
  align-items:center;
  justify-content:center;
}

.menu:active{
  background:#1a1e23;
}

.menu svg{
  width:21px;
  height:21px;
  stroke:#aeb4bb;
}

/* CONTENT */

.content{
  flex:1;
  overflow-y:auto;
  padding:28px 18px 100px;
}

.welcome{
  margin-bottom:25px;
}

.welcome h1{
  margin:0 0 7px;
  font-size:27px;
  line-height:1.1;
  font-weight:700;
}

.welcome p{
  margin:0;
  color:#858c95;
  font-size:14px;
}

/* NEW PROJECT */

.new-project{
  width:100%;
  height:62px;
  border-radius:12px;
  background:#8ee35d;
  color:#091006;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  font-size:15px;
  font-weight:700;
  box-shadow:0 8px 25px rgba(142,227,93,.08);
  transition:.15s;
}

.new-project:active{
  transform:scale(.98);
  background:#7bd94d;
}

.new-project svg{
  width:21px;
  height:21px;
  stroke:#091006;
}

/* SECTIONS */

.section{
  margin-top:34px;
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:13px;
}

.section-title h2{
  margin:0;
  font-size:12px;
  letter-spacing:1.2px;
  color:#747b84;
  font-weight:700;
}

.section-title button{
  background:none;
  color:#8ee35d;
  font-size:12px;
  font-weight:600;
}

/* PROJECT CARD */

.project{
  width:100%;
  min-height:88px;
  padding:16px;
  border:1px solid #22272e;
  border-radius:13px;
  background:#111419;
  display:flex;
  align-items:center;
  gap:14px;
  text-align:left;
  transition:.15s;
}

.project:active{
  transform:scale(.985);
  background:#15191e;
}

.project-icon{
  width:49px;
  height:49px;
  flex-shrink:0;
  border-radius:11px;
  background:#191e24;
  display:flex;
  align-items:center;
  justify-content:center;
}

.project-icon svg{
  width:24px;
  height:24px;
  stroke:#8ee35d;
}

.project-info{
  min-width:0;
  flex:1;
}

.project-name{
  font-size:15px;
  font-weight:650;
  margin-bottom:6px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.project-meta{
  font-size:12px;
  color:#737a83;
}

.project-arrow{
  width:18px;
  height:18px;
  stroke:#626971;
  flex-shrink:0;
}

/* EMPTY */

.empty{
  padding:30px 15px;
  border:1px dashed #272c33;
  border-radius:13px;
  text-align:center;
  color:#666e77;
  font-size:13px;
}

/* BOTTOM NAV */

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:76px;
  padding:7px 14px env(safe-area-inset-bottom);
  display:flex;
  align-items:center;
  justify-content:space-around;
  background:rgba(13,16,20,.96);
  border-top:1px solid #20242a;
  backdrop-filter:blur(15px);
  z-index:20;
}

.nav-item{
  width:31%;
  height:58px;
  background:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
  color:#646b73;
  font-size:10px;
}

.nav-item svg{
  width:21px;
  height:21px;
  stroke:currentColor;
}

.nav-item.active{
  color:#8ee35d;
}

.nav-item:active{
  background:#171b20;
  border-radius:10px;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.68);
  display:none;
  align-items:flex-end;
  z-index:50;
}

.modal.show{
  display:flex;
}

.sheet{
  width:100%;
  padding:22px 18px calc(22px + env(safe-area-inset-bottom));
  background:#111419;
  border-top:1px solid #272c33;
  border-radius:20px 20px 0 0;
  animation:up .2s ease;
}

@keyframes up{
  from{
    transform:translateY(100%);
  }
  to{
    transform:translateY(0);
  }
}

.sheet h2{
  margin:0 0 6px;
  font-size:20px;
}

.sheet p{
  margin:0 0 20px;
  color:#777f88;
  font-size:13px;
}

.input{
  width:100%;
  height:52px;
  padding:0 14px;
  border:1px solid #292e35;
  border-radius:10px;
  outline:none;
  background:#0b0e12;
  color:#fff;
  font-size:15px;
}

.input:focus{
  border-color:#8ee35d;
}

.sheet-actions{
  display:flex;
  gap:10px;
  margin-top:14px;
}

.cancel,
.create{
  flex:1;
  height:50px;
  border-radius:10px;
  font-weight:650;
}

.cancel{
  background:#1b1f24;
  color:#aeb4bb;
}

.create{
  background:#8ee35d;
  color:#091006;
}

.hidden{
  display:none!important;
}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <header class="header">

    <div class="brand">

      <div class="logo">
        <svg viewBox="0 0 24 24">
          <path d="M6 5c5-3 11 0 11 5 0 5-5 8-9 5"/>
          <path d="M8 8c2-1 5 0 5 2 0 2-2 3-4 2"/>
          <circle cx="17" cy="5" r="1.5" fill="currentColor" stroke="none"/>
        </svg>
      </div>

      Snake Forge

    </div>

    <button class="menu" onclick="openMenu()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="5" r="1"/>
        <circle cx="12" cy="12" r="1"/>
        <circle cx="12" cy="19" r="1"/>
      </svg>
    </button>

  </header>


  <!-- CONTENT -->
  <main class="content">

    <div class="welcome">
      <h1>Welcome back</h1>
      <p>Build your next game.</p>
    </div>


    <button class="new-project" onclick="openNewProject()">

      <svg viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2"
           stroke-linecap="round">
        <path d="M12 5v14"/>
        <path d="M5 12h14"/>
      </svg>

      NEW PROJECT

    </button>


    <!-- RECENT -->
    <section class="section">

      <div class="section-title">
        <h2>RECENT PROJECTS</h2>

        <button onclick="showProjects()">
          View all
        </button>
      </div>


      <div id="projectsList">

        <button class="project" onclick="openProject('My First Game')">

          <div class="project-icon">

            <svg viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M7 4h10"/>
              <path d="M7 4v4l-2 3v6a3 3 0 0 0 3 3h8a3 3 0 0 0 3-3v-6l-2-3V4"/>
              <path d="M9 14h6"/>
              <path d="M12 11v6"/>
            </svg>

          </div>

          <div class="project-info">

            <div class="project-name">
              My First Game
            </div>

            <div class="project-meta">
              Last opened: Today
            </div>

          </div>

          <svg class="project-arrow"
               viewBox="0 0 24 24"
               fill="none"
               stroke="currentColor"
               stroke-width="2"
               stroke-linecap="round"
               stroke-linejoin="round">
            <path d="m9 18 6-6-6-6"/>
          </svg>

        </button>

      </div>

    </section>

  </main>


  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">

    <button class="nav-item active" onclick="navigate('home')">

      <svg viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="m3 10 9-7 9 7"/>
        <path d="M5 9v11h14V9"/>
        <path d="M9 20v-6h6v6"/>
      </svg>

      Home

    </button>


    <button class="nav-item" onclick="navigate('projects')">

      <svg viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 5h6l2 2h8v12H4z"/>
      </svg>

      Projects

    </button>


    <button class="nav-item" onclick="navigate('settings')">

      <svg viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.7 1.7-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5v.2h-2.4v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1L8 17l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H6v-2.4h.9a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9L8 8.6l1.7-1.7.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.5v-.2h2.4v.2a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1 1.7 1.7-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.5 1h.2V14h-.2a1.7 1.7 0 0 0-1.5 1z"/>
      </svg>

      Settings

    </button>

  </nav>

</div>


<!-- NEW PROJECT MODAL -->

<div class="modal" id="newProjectModal"
     onclick="outsideClose(event)">

  <div class="sheet">

    <h2>New Project</h2>

    <p>Create a new game project.</p>

    <input
      id="projectName"
      class="input"
      type="text"
      placeholder="Project name"
      maxlength="40"
      autocomplete="off"
    >

    <div class="sheet-actions">

      <button class="cancel" onclick="closeNewProject()">
        Cancel
      </button>

      <button class="create" onclick="createProject()">
        Create
      </button>

    </div>

  </div>

</div>


<script>

/* =========================
   PROJECT STORAGE
========================= */

const STORAGE_KEY = "snakeForgeProjects";

function getProjects(){

  try{
    return JSON.parse(
      localStorage.getItem(STORAGE_KEY)
    ) || [];
  }catch(e){
    return [];
  }

}

function saveProjects(projects){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(projects)
  );

}


/* =========================
   NEW PROJECT
========================= */

function openNewProject(){

  const modal =
    document.getElementById("newProjectModal");

  modal.classList.add("show");

  setTimeout(()=>{
    document.getElementById("projectName").focus();
  },100);

}


function closeNewProject(){

  document
    .getElementById("newProjectModal")
    .classList.remove("show");

  document.getElementById("projectName").value = "";

}


function outsideClose(event){

  if(event.target.id === "newProjectModal"){
    closeNewProject();
  }

}


function createProject(){

  const input =
    document.getElementById("projectName");

  const name =
    input.value.trim();

  if(!name){
    input.focus();
    return;
  }

  const projects = getProjects();

  const project = {

    id: Date.now(),

    name:name,

    createdAt:new Date().toISOString(),

    lastOpened:new Date().toISOString()

  };

  projects.unshift(project);

  saveProjects(projects);

  closeNewProject();

  renderProjects();

  /*
    Próxima etapa:
    abrir o Project Editor do Snake Forge.
  */

  openProject(name);

}


/* =========================
   PROJECT LIST
========================= */

function renderProjects(){

  const container =
    document.getElementById("projectsList");

  const projects =
    getProjects();

  if(projects.length === 0){

    container.innerHTML = `
      <div class="empty">
        No projects yet.
      </div>
    `;

    return;

  }

  const recent =
    projects.slice(0,5);

  container.innerHTML =
    recent.map(project => `

      <button
        class="project"
        onclick="openProject('${escapeHtml(project.name)}')">

        <div class="project-icon">

          <svg viewBox="0 0 24 24"
               fill="none"
               stroke="currentColor"
               stroke-width="1.8"
               stroke-linecap="round"
               stroke-linejoin="round">

            <path d="M7 4h10"/>
            <path d="M7 4v4l-2 3v6a3 3 0 0 0 3 3h8a3 3 0 0 0 3-3v-6l-2-3V4"/>
            <path d="M9 14h6"/>
            <path d="M12 11v6"/>

          </svg>

        </div>

        <div class="project-info">

          <div class="project-name">
            ${escapeHtml(project.name)}
          </div>

          <div class="project-meta">
            Project
          </div>

        </div>

        <svg class="project-arrow"
             viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2">

          <path d="m9 18 6-6-6-6"/>

        </svg>

      </button>

    `).join("");

}


function escapeHtml(text){

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}


/* =========================
   OPEN PROJECT
========================= */

function openProject(name){

  /*
    Aqui será conectado o Editor.
    Por enquanto identificamos o projeto
    selecionado.

    Não usamos alert(), mantendo a
    interface limpa para mobile.
  */

  console.log(
    "Opening Snake Forge project:",
    name
  );

}


/* =========================
   NAVIGATION
========================= */

function navigate(section){

  document
    .querySelectorAll(".nav-item")
    .forEach(item =>
      item.classList.remove("active")
    );

  const items =
    document.querySelectorAll(".nav-item");

  if(section === "home"){

    items[0].classList.add("active");

  }

  if(section === "projects"){

    items[1].classList.add("active");

    showProjects();

  }

  if(section === "settings"){

    items[2].classList.add("active");

    console.log("Settings");

  }

}


function showProjects(){

  console.log("Project Manager");

}


function openMenu(){

  console.log("Snake Forge menu");

}


/* =========================
   ENTER = CREATE
========================= */

document
  .getElementById("projectName")
  .addEventListener("keydown",function(e){

    if(e.key === "Enter"){
      createProject();
    }

    if(e.key === "Escape"){
      closeNewProject();
    }

  });


/* =========================
   INIT
========================= */

renderProjects();

</script>

</body>
</html>
