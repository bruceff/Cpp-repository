<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>C++ Executor</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;

    background: #0d0d0d;
    color: white;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body {
    padding-bottom: 30px;
}


/* =========================
   CABEÇALHO
========================= */

.header {

    height: 60px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #111111;

    border-bottom: 1px solid #292929;

    font-size: 21px;
    font-weight: 700;

}


/* =========================
   ÁREA DO EDITOR
========================= */

.editor-area {

    padding: 15px;

}

.label {

    margin-bottom: 8px;

    color: #888888;

    font-size: 13px;

    font-weight: 700;

    letter-spacing: 0.5px;

}

textarea {

    display: block;

    width: 100%;

    height: 48vh;

    padding: 15px;

    resize: none;

    outline: none;

    border: 1px solid #333333;

    border-radius: 10px;

    background: #181818;

    color: #f5f5f5;

    font-family:
        Menlo,
        Monaco,
        Consolas,
        monospace;

    font-size: 15px;

    line-height: 1.5;

    tab-size: 4;

}


/* =========================
   BOTÕES
========================= */

.buttons {

    display: flex;

    gap: 10px;

    padding:
        0
        15px
        15px
        15px;

}

button {

    flex: 1;

    padding: 15px;

    border: none;

    border-radius: 10px;

    color: white;

    font-size: 16px;

    font-weight: 700;

}

.run {

    background: #20c968;

}

.clear {

    background: #292929;

}

button:active {

    transform: scale(0.98);

}


/* =========================
   TERMINAL
========================= */

.terminal-area {

    padding:
        0
        15px
        20px
        15px;

}

.terminal {

    min-height: 140px;

    padding: 15px;

    background: #050505;

    border: 1px solid #222222;

    border-radius: 10px;

    color: #00ff66;

    font-family:
        Menlo,
        Monaco,
        Consolas,
        monospace;

    font-size: 14px;

    line-height: 1.5;

    white-space: pre-wrap;

    overflow-x: auto;

}


/* =========================
   STATUS
========================= */

.status {

    color: #777777;

}

</style>

</head>


<body>


<!-- =========================
     CABEÇALHO
========================= -->

<div class="header">

    C++ EXECUTOR

</div>



<!-- =========================
     EDITOR
========================= -->

<div class="editor-area">

    <div class="label">

        CÓDIGO C++

    </div>


    <textarea id="code">#include <iostream>

int main() {

    std::cout << "Olá!";

    return 0;

}</textarea>

</div>



<!-- =========================
     BOTÕES
========================= -->

<div class="buttons">

    <button
        class="run"
        onclick="executar()">

        ▶ EXECUTAR

    </button>


    <button
        class="clear"
        onclick="limpar()">

        LIMPAR

    </button>

</div>



<!-- =========================
     TERMINAL
========================= -->

<div class="terminal-area">

    <div class="label">

        TERMINAL

    </div>


    <div
        class="terminal"
        id="terminal">

        <span class="status">
            > Aguardando execução...
        </span>

    </div>

</div>



<script>

/*
==================================================
 FUNÇÃO PRINCIPAL
==================================================
*/

async function executar() {


    const codigo =
        document.getElementById("code").value;


    const terminal =
        document.getElementById("terminal");


    /*
    Verifica se existe código
    */

    if (!codigo.trim()) {

        terminal.textContent =
            "> Erro: nenhum código foi inserido.";

        return;

    }


    /*
    Mostra estado
    */

    terminal.textContent =
        "> Enviando código para Judge0...\n";


    try {


        /*
        ==================================================
        CODIFICA O CÓDIGO C++ EM BASE64
        ==================================================
        */

        const codigoBase64 =
            btoa(
                unescape(
                    encodeURIComponent(codigo)
                )
            );


        /*
        ==================================================
        ENVIA PARA JUDGE0
        ==================================================
        */

        const resposta =

            await fetch(

                "https://ce.judge0.com/submissions?base64_encoded=true&wait=true",

                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:

                        JSON.stringify({

                            language_id: 54,

                            source_code:
                                codigoBase64,

                            stdin: ""

                        })

                }

            );


        /*
        Verifica resposta HTTP
        */

        if (!resposta.ok) {

            throw new Error(
                "HTTP " +
                resposta.status
            );

        }


        /*
        ==================================================
        CONVERTE RESPOSTA PARA JSON
        ==================================================
        */

        const resultado =
            await resposta.json();


        /*
        ==================================================
        PREPARA SAÍDA
        ==================================================
        */

        let saida = "";


        /*
        STDOUT
        */

        if (resultado.stdout) {

            saida +=
                decodificarBase64(
                    resultado.stdout
                );

        }


        /*
        STDERR
        */

        if (resultado.stderr) {

            if (saida.length > 0) {

                saida += "\n";

            }

            saida +=
                decodificarBase64(
                    resultado.stderr
                );

        }


        /*
        MENSAGEM DE COMPILAÇÃO
        */

        if (resultado.compile_output) {

            if (saida.length > 0) {

                saida += "\n";

            }

            saida +=
                decodificarBase64(
                    resultado.compile_output
                );

        }


        /*
        CASO NÃO TENHA SAÍDA
        */

        if (!saida.trim()) {

            if (
                resultado.status &&
                resultado.status.description
            ) {

                saida =
                    "> " +
                    resultado.status.description;

            }

            else {

                saida =
                    "> Programa executado sem saída.";

            }

        }


        /*
        ==================================================
        MOSTRA RESULTADO
        ==================================================
        */

        terminal.textContent =
            saida;


    }

    catch (erro) {


        /*
        ==================================================
        ERRO
        ==================================================
        */

        terminal.textContent =

            "> ERRO AO EXECUTAR:\n\n" +

            erro.message +

            "\n\n" +

            "Se aparecer 'Failed to fetch', " +

            "o navegador provavelmente bloqueou " +

            "a conexão com o Judge0 (CORS).";


    }

}



/*
==================================================
 DECODIFICAR BASE64
==================================================
*/

function decodificarBase64(texto) {

    try {

        return decodeURIComponent(

            escape(
                atob(texto)
            )

        );

    }

    catch (erro) {

        return atob(texto);

    }

}



/*
==================================================
 LIMPAR EDITOR
==================================================
*/

function limpar() {


    document.getElementById("code").value = "";


    document.getElementById("terminal").textContent =

        "> Terminal limpo.";

}

</script>


</body>

</html>
