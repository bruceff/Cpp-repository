<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>C++ Executor</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    background: #0d0d0d;
    color: white;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;

}

body {
    padding-bottom: 30px;
}


/* =========================
   CABEÇALHO
========================= */

.header {

    height: 60px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #111;

    border-bottom: 1px solid #292929;

    font-size: 21px;
    font-weight: 700;

}


/* =========================
   EDITOR
========================= */

.editor-area {

    padding: 15px;

}

.label {

    margin-bottom: 8px;

    color: #888;

    font-size: 13px;

    font-weight: 700;

}


/* Container do editor */

.editor-wrapper {

    display: flex;

    width: 100%;

    height: 48vh;

    overflow: hidden;

    background: #181818;

    border: 1px solid #333;

    border-radius: 10px;

}


/* Números */

.line-numbers {

    width: 42px;

    flex-shrink: 0;

    padding-top: 15px;

    padding-right: 10px;

    background: #151515;

    color: #666;

    text-align: right;

    font-family:
        Menlo,
        Monaco,
        Consolas,
        monospace;

    font-size: 15px;

    line-height: 1.5;

    user-select: none;

    overflow: hidden;

}


/* Editor */

textarea {

    flex: 1;

    width: 100%;

    height: 100%;

    padding: 15px;

    resize: none;

    outline: none;

    border: none;

    background: #181818;

    color: #f5f5f5;

    font-family:
        Menlo,
        Monaco,
        Consolas,
        monospace;

    font-size: 15px;

    line-height: 1.5;

    tab-size: 4;

}


/* =========================
   BOTÕES
========================= */

.buttons {

    display: flex;

    gap: 10px;

    padding:
        0
        15px
        15px
        15px;

}

button {

    flex: 1;

    padding: 15px;

    border: none;

    border-radius: 10px;

    color: white;

    font-size: 16px;

    font-weight: 700;

}

.run {

    background: #20c968;

}

.clear {

    background: #292929;

}

button:active {

    transform: scale(0.98);

}


/* =========================
   TERMINAL
========================= */

.terminal-area {

    padding:
        0
        15px
        20px
        15px;

}

.terminal {

    min-height: 140px;

    padding: 15px;

    background: #050505;

    border: 1px solid #222;

    border-radius: 10px;

    color: #00ff66;

    font-family:
        Menlo,
        Monaco,
        Consolas,
        monospace;

    font-size: 14px;

    line-height: 1.5;

    white-space: pre-wrap;

    overflow-x: auto;

}

</style>

</head>


<body>


<!-- CABEÇALHO -->

<div class="header">

    C++ EXECUTOR

</div>



<!-- EDITOR -->

<div class="editor-area">

    <div class="label">

        CÓDIGO C++

    </div>


    <div class="editor-wrapper">


        <!-- NÚMEROS -->

        <div
            class="line-numbers"
            id="lineNumbers">
        </div>


        <!-- CÓDIGO -->

        <textarea
            id="code"
            spellcheck="false">#include <iostream>

int main() {

    std::cout << "Olá!";

    return 0;

}</textarea>


    </div>

</div>



<!-- BOTÕES -->

<div class="buttons">

    <button
        class="run"
        onclick="executar()">

        ▶ EXECUTAR

    </button>


    <button
        class="clear"
        onclick="limpar()">

        LIMPAR

    </button>

</div>



<!-- TERMINAL -->

<div class="terminal-area">

    <div class="label">

        TERMINAL

    </div>


    <div
        class="terminal"
        id="terminal">

        > Aguardando execução...

    </div>

</div>



<script>


/* ==================================================
   NUMERAÇÃO DAS LINHAS
================================================== */

const editor =
    document.getElementById("code");


const lineNumbers =
    document.getElementById("lineNumbers");



function atualizarLinhas() {


    const quantidade =
        editor.value.split("\n").length;


    let numeros = "";


    for (
        let i = 1;
        i <= quantidade;
        i++
    ) {

        numeros += i + "<br>";

    }


    lineNumbers.innerHTML =
        numeros;

}



/* ==================================================
   ATUALIZAR AO DIGITAR
================================================== */

editor.addEventListener(
    "input",
    atualizarLinhas
);



/* ==================================================
   SINCRONIZAR ROLAGEM
================================================== */

editor.addEventListener(
    "scroll",
    function() {

        lineNumbers.scrollTop =
            editor.scrollTop;

    }
);



/* ==================================================
   EXECUTAR
================================================== */

async function executar() {


    const codigo =
        editor.value;


    const terminal =
        document.getElementById("terminal");


    if (!codigo.trim()) {

        terminal.textContent =
            "> Nenhum código foi inserido.";

        return;

    }


    terminal.textContent =
        "> Enviando para Judge0...\n";


    try {


        const codigoBase64 =
            btoa(
                unescape(
                    encodeURIComponent(codigo)
                )
            );


        const resposta =

            await fetch(

                "https://ce.judge0.com/submissions?base64_encoded=true&wait=true",

                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:

                        JSON.stringify({

                            language_id: 54,

                            source_code:
                                codigoBase64,

                            stdin: ""

                        })

                }

            );


        if (!resposta.ok) {

            throw new Error(
                "HTTP " +
                resposta.status
            );

        }


        const resultado =
            await resposta.json();


        let saida = "";


        if (resultado.stdout) {

            saida +=
                decodificarBase64(
                    resultado.stdout
                );

        }


        if (resultado.stderr) {

            if (saida) {

                saida += "\n";

            }

            saida +=
                decodificarBase64(
                    resultado.stderr
                );

        }


        if (resultado.compile_output) {

            if (saida) {

                saida += "\n";

            }

            saida +=
                decodificarBase64(
                    resultado.compile_output
                );

        }


        if (!saida.trim()) {

            if (
                resultado.status &&
                resultado.status.description
            ) {

                saida =
                    "> " +
                    resultado.status.description;

            }

            else {

                saida =
                    "> Programa executado sem saída.";

            }

        }


        terminal.textContent =
            saida;


    }

    catch (erro) {


        terminal.textContent =

            "> ERRO:\n\n" +
            erro.message;

    }

}



/* ==================================================
   BASE64
================================================== */

function decodificarBase64(texto) {

    try {

        return decodeURIComponent(
            escape(atob(texto))
        );

    }

    catch (erro) {

        return atob(texto);

    }

}



/* ==================================================
   LIMPAR
================================================== */

function limpar() {


    editor.value = "";


    atualizarLinhas();


    document.getElementById(
        "terminal"
    ).textContent =
        "> Terminal limpo.";

}



/* ==================================================
   INICIALIZAÇÃO
================================================== */

atualizarLinhas();


</script>


</body>

</html>
