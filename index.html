<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>C++ Executor</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    background: #0d0d0d;
    color: white;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;
}

body {
    padding-bottom: 30px;
}


/* =========================
   CABEÇALHO
========================= */

.header {

    height: 60px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #111;

    border-bottom: 1px solid #292929;

    font-size: 21px;
    font-weight: 700;
}


/* =========================
   EDITOR
========================= */

.editor-area {
    padding: 15px;
}

.label {

    margin-bottom: 8px;

    color: #888;

    font-size: 13px;

    font-weight: 700;
}


.editor-wrapper {

    display: flex;

    width: 100%;
    height: 48vh;

    overflow: hidden;

    background: #181818;

    border: 1px solid #333;

    border-radius: 10px;
}


/* =========================
   NÚMEROS
========================= */

.line-numbers {

    width: 42px;

    flex-shrink: 0;

    padding-top: 15px;
    padding-right: 10px;

    background: #151515;

    color: #666;

    text-align: right;

    font-family:
        Menlo,
        Monaco,
        Consolas,
        monospace;

    font-size: 15px;

    line-height: 1.5;

    user-select: none;

    overflow: hidden;
}


/* =========================
   EDITOR
========================= */

.editor {

    flex: 1;

    width: 100%;
    height: 100%;

    padding: 15px;

    resize: none;

    outline: none;

    border: none;

    background: #181818;

    color: #f5f5f5;

    caret-color: white;

    font-family:
        Menlo,
        Monaco,
        Consolas,
        monospace;

    font-size: 15px;

    line-height: 1.5;

    tab-size: 4;

    white-space: pre;

    overflow: auto;

}


/* =========================
   CORES DO C++
========================= */

.editor::selection {
    background: #444;
}


/* =========================
   BOTÕES
========================= */

.buttons {

    display: flex;

    gap: 8px;

    padding:
        0
        15px
        15px;
}

button {

    flex: 1;

    padding: 14px 8px;

    border: none;

    border-radius: 10px;

    color: white;

    font-size: 14px;

    font-weight: 700;
}

.run {
    background: #20c968;
}

.save {
    background: #2878ff;
}

.clear {
    background: #292929;
}

button:active {
    transform: scale(0.98);
}


/* =========================
   TERMINAL
========================= */

.terminal-area {

    padding:
        0
        15px
        20px;
}

.terminal {

    min-height: 140px;

    padding: 15px;

    background: #050505;

    border: 1px solid #222;

    border-radius: 10px;

    color: #00ff66;

    font-family:
        Menlo,
        Monaco,
        Consolas,
        monospace;

    font-size: 14px;

    line-height: 1.5;

    white-space: pre-wrap;

    overflow-x: auto;
}


/* =========================
   CÓDIGOS SALVOS
========================= */

.saved-area {

    padding:
        0
        15px
        20px;
}

.saved-title {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 10px;

    color: #888;

    font-size: 13px;

    font-weight: 700;
}

.saved-list {

    display: flex;

    flex-direction: column;

    gap: 8px;
}

.saved-item {

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 12px;

    background: #181818;

    border: 1px solid #2b2b2b;

    border-radius: 10px;
}

.saved-name {

    flex: 1;

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;

    color: white;

    font-size: 14px;
}

.saved-actions {

    display: flex;

    gap: 6px;
}

.saved-actions button {

    flex: none;

    width: auto;

    padding:
        8px
        10px;

    font-size: 12px;
}

.open-btn {
    background: #333;
}

.delete-btn {
    background: #8f2525;
}


/* =========================
   MODAL
========================= */

.modal {

    display: none;

    position: fixed;

    inset: 0;

    background: rgba(0,0,0,0.75);

    align-items: center;

    justify-content: center;

    padding: 20px;

    z-index: 1000;
}

.modal-box {

    width: 100%;

    max-width: 400px;

    padding: 20px;

    background: #181818;

    border: 1px solid #333;

    border-radius: 14px;
}

.modal-box h2 {

    margin-top: 0;

    font-size: 19px;
}

.modal-box input {

    width: 100%;

    padding: 13px;

    margin:
        10px
        0
        15px;

    border: 1px solid #444;

    border-radius: 8px;

    outline: none;

    background: #0d0d0d;

    color: white;

    font-size: 16px;
}

.modal-buttons {

    display: flex;

    gap: 8px;
}

.modal-buttons button {
    padding: 13px;
}

.cancel {
    background: #333;
}

.confirm {
    background: #2878ff;
}

</style>

</head>


<body>


<!-- CABEÇALHO -->

<div class="header">

    C++ EXECUTOR

</div>



<!-- EDITOR -->

<div class="editor-area">

    <div class="label">
        CÓDIGO C++
    </div>


    <div class="editor-wrapper">


        <!-- NÚMEROS -->

        <div
            class="line-numbers"
            id="lineNumbers">
        </div>


        <!-- EDITOR -->

        <textarea
            class="editor"
            id="code"
            spellcheck="false">#include <iostream>

int main() {

    int idade = 18;

    std::cout << "Olá!";

    return 0;

}</textarea>


    </div>

</div>



<!-- BOTÕES -->

<div class="buttons">


    <button
        class="run"
        onclick="executar()">

        ▶ EXECUTAR

    </button>


    <button
        class="save"
        onclick="abrirSalvar()">

        💾 SALVAR

    </button>


    <button
        class="clear"
        onclick="limpar()">

        LIMPAR

    </button>


</div>



<!-- TERMINAL -->

<div class="terminal-area">

    <div class="label">
        TERMINAL
    </div>


    <div
        class="terminal"
        id="terminal">

        > Aguardando execução...

    </div>

</div>



<!-- CÓDIGOS SALVOS -->

<div class="saved-area">


    <div class="saved-title">

        <span>MEUS CÓDIGOS</span>

        <span id="savedCount">
            0
        </span>

    </div>


    <div
        class="saved-list"
        id="savedList">
    </div>


</div>



<!-- MODAL -->

<div
    class="modal"
    id="saveModal">


    <div class="modal-box">


        <h2>
            Salvar código
        </h2>


        <input
            id="codeName"
            type="text"
            placeholder="Nome do código">


        <div class="modal-buttons">


            <button
                class="cancel"
                onclick="fecharSalvar()">

                CANCELAR

            </button>


            <button
                class="confirm"
                onclick="salvarCodigo()">

                SALVAR

            </button>


        </div>


    </div>

</div>



<script>


/* ==================================================
   ELEMENTOS
================================================== */

const editor =
    document.getElementById("code");

const lineNumbers =
    document.getElementById("lineNumbers");

const savedList =
    document.getElementById("savedList");

const savedCount =
    document.getElementById("savedCount");


/* ==================================================
   LINHAS
================================================== */

function atualizarLinhas() {


    const quantidade =
        editor.value.split("\n").length;


    let numeros = "";


    for (
        let i = 1;
        i <= quantidade;
        i++
    ) {

        numeros +=
            i + "<br>";

    }


    lineNumbers.innerHTML =
        numeros;

}


editor.addEventListener(
    "input",
    atualizarLinhas
);


/* ==================================================
   ROLAGEM
================================================== */

editor.addEventListener(
    "scroll",
    function() {

        lineNumbers.scrollTop =
            editor.scrollTop;

    }
);


/* ==================================================
   EXECUTAR
================================================== */

async function executar() {


    const codigo =
        editor.value;


    const terminal =
        document.getElementById(
            "terminal"
        );


    if (!codigo.trim()) {

        terminal.textContent =
            "> Nenhum código foi inserido.";

        return;

    }


    terminal.textContent =
        "> Enviando para Judge0...\n";


    try {


        const codigoBase64 =

            btoa(

                unescape(

                    encodeURIComponent(
                        codigo
                    )

                )

            );


        const resposta =

            await fetch(

                "https://ce.judge0.com/submissions?base64_encoded=true&wait=true",

                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:

                        JSON.stringify({

                            language_id: 54,

                            source_code:
                                codigoBase64,

                            stdin: ""

                        })

                }

            );


        if (!resposta.ok) {

            throw new Error(
                "HTTP " +
                resposta.status
            );

        }


        const resultado =
            await resposta.json();


        let saida = "";


        if (resultado.stdout) {

            saida +=
                decodificarBase64(
                    resultado.stdout
                );

        }


        if (resultado.stderr) {

            if (saida) {
                saida += "\n";
            }

            saida +=
                decodificarBase64(
                    resultado.stderr
                );

        }


        if (resultado.compile_output) {

            if (saida) {
                saida += "\n";
            }

            saida +=
                decodificarBase64(
                    resultado.compile_output
                );

        }


        if (!saida.trim()) {

            if (
                resultado.status &&
                resultado.status.description
            ) {

                saida =
                    "> " +
                    resultado.status.description;

            }

            else {

                saida =
                    "> Programa executado sem saída.";

            }

        }


        terminal.textContent =
            saida;


    }

    catch (erro) {

        terminal.textContent =

            "> ERRO:\n\n" +
            erro.message;

    }

}


/* ==================================================
   BASE64
================================================== */

function decodificarBase64(texto) {

    try {

        return decodeURIComponent(
            escape(
                atob(texto)
            )
        );

    }

    catch (erro) {

        return atob(texto);

    }

}


/* ==================================================
   LIMPAR
================================================== */

function limpar() {


    editor.value = "";


    atualizarLinhas();


    document.getElementById(
        "terminal"
    ).textContent =
        "> Terminal limpo.";

}


/* ==================================================
   SALVAR
================================================== */

function abrirSalvar() {


    document.getElementById(
        "saveModal"
    ).style.display =
        "flex";


    document.getElementById(
        "codeName"
    ).value = "";


    setTimeout(
        function() {

            document.getElementById(
                "codeName"
            ).focus();

        },
        100
    );

}


function fecharSalvar() {

    document.getElementById(
        "saveModal"
    ).style.display =
        "none";

}


function salvarCodigo() {


    const input =
        document.getElementById(
            "codeName"
        );


    let nome =
        input.value.trim();


    if (!nome) {

        nome =
            "Código sem nome";

    }


    const codigo =
        editor.value;


    let codigos =

        JSON.parse(

            localStorage.getItem(
                "cpp_codigos"
            ) || "[]"

        );


    codigos.push({

        id:
            Date.now(),

        nome:
            nome,

        codigo:
            codigo,

        data:
            new Date().toLocaleString(
                "pt-BR"
            )

    });


    localStorage.setItem(

        "cpp_codigos",

        JSON.stringify(
            codigos
        )

    );


    fecharSalvar();


    carregarCodigos();


    document.getElementById(
        "terminal"
    ).textContent =

        "> Código '" +
        nome +
        "' salvo.";

}


/* ==================================================
   CARREGAR
================================================== */

function carregarCodigos() {


    const codigos =

        JSON.parse(

            localStorage.getItem(
                "cpp_codigos"
            ) || "[]"

        );


    savedList.innerHTML =
        "";


    savedCount.textContent =
        codigos.length;


    if (codigos.length === 0) {

        savedList.innerHTML =

            '<div style="color:#666;font-size:13px;">' +

            'Nenhum código salvo.' +

            '</div>';

        return;

    }


    codigos.forEach(
        function(item) {


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "saved-item";


            const nome =
                document.createElement(
                    "div"
                );


            nome.className =
                "saved-name";


            nome.textContent =
                item.nome;


            const actions =
                document.createElement(
                    "div"
                );


            actions.className =
                "saved-actions";


            const abrir =
                document.createElement(
                    "button"
                );


            abrir.className =
                "open-btn";


            abrir.textContent =
                "ABRIR";


            abrir.onclick =
                function() {

                    abrirCodigo(
                        item.id
                    );

                };


            const excluir =
                document.createElement(
                    "button"
                );


            excluir.className =
                "delete-btn";


            excluir.textContent =
                "X";


            excluir.onclick =
                function() {

                    excluirCodigo(
                        item.id
                    );

                };


            actions.appendChild(
                abrir
            );


            actions.appendChild(
                excluir
            );


            div.appendChild(
                nome
            );


            div.appendChild(
                actions
            );


            savedList.appendChild(
                div
            );

        }
    );

}


/* ==================================================
   ABRIR
================================================== */

function abrirCodigo(id) {


    const codigos =

        JSON.parse(

            localStorage.getItem(
                "cpp_codigos"
            ) || "[]"

        );


    const codigo =
        codigos.find(
            function(item) {

                return item.id === id;

            }
        );


    if (!codigo) {
        return;
    }


    editor.value =
        codigo.codigo;


    atualizarLinhas();


    document.getElementById(
        "terminal"
    ).textContent =

        "> Código '" +
        codigo.nome +
        "' carregado.";


    window.scrollTo(
        0,
        0
    );

}


/* ==================================================
   EXCLUIR
================================================== */

function excluirCodigo(id) {


    if (
        !confirm(
            "Excluir este código?"
        )
    ) {

        return;

    }


    let codigos =

        JSON.parse(

            localStorage.getItem(
                "cpp_codigos"
            ) || "[]"

        );


    codigos =
        codigos.filter(
            function(item) {

                return item.id !== id;

            }
        );


    localStorage.setItem(

        "cpp_codigos",

        JSON.stringify(
            codigos
        )

    );


    carregarCodigos();

}


/* ==================================================
   INICIAR
================================================== */

atualizarLinhas();

carregarCodigos();

</script>


</body>

</html>
